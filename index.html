<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Phòng Gọi Điện</title>
  <script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, -apple-system, sans-serif; }
    body {
      min-height: 100vh; display: flex; align-items: center; justify-content: center;
      background: #0f172a; color: #f8fafc; padding: 20px;
    }
    .card {
      width: 100%; max-width: 400px; background: #1e293b; border: 1px solid #334155;
      border-radius: 20px; padding: 28px 24px; box-shadow: 0 20px 40px rgba(0,0,0,0.4);
      text-align: center;
    }
    h1 { font-size: 1.4rem; margin-bottom: 6px; }
    .sub { color: #94a3b8; font-size: 0.85rem; margin-bottom: 20px; }
    .btn {
      width: 100%; padding: 14px; border: none; border-radius: 12px;
      font-size: 1rem; font-weight: 600; cursor: pointer; transition: 0.15s;
    }
    .btn-primary { background: #3b82f6; color: #fff; }
    .btn-primary:hover { background: #2563eb; }
    .btn-success { background: #10b981; color: #fff; }
    .btn-success:hover { background: #059669; }
    .btn-danger { background: #ef4444; color: #fff; }
    .btn-danger:hover { background: #dc2626; }
    .btn-muted { background: #334155; color: #e2e8f0; }
    .btn-muted.active { background: #f59e0b; color: #0f172a; }
    .divider {
      display: flex; align-items: center; gap: 12px; margin: 18px 0; color: #64748b; font-size: 0.85rem;
    }
    .divider::before, .divider::after { content: ""; flex: 1; height: 1px; background: #334155; }
    .join-row { display: flex; gap: 8px; }
    input[type="text"] {
      flex: 1; padding: 14px; border-radius: 12px; border: 1px solid #475569;
      background: #0f172a; color: #fff; font-size: 1.05rem; text-align: center;
      letter-spacing: 3px; text-transform: uppercase; outline: none;
    }
    input[type="text"]:focus { border-color: #3b82f6; }
    .opt-row {
      display: flex; align-items: center; justify-content: center; gap: 8px;
      margin-top: 16px; font-size: 0.85rem; color: #cbd5e1; cursor: pointer; user-select: none;
    }
    .opt-row input { width: 16px; height: 16px; accent-color: #3b82f6; cursor: pointer; }
    .code-box {
      background: #0f172a; border: 2px dashed #3b82f6; border-radius: 14px;
      padding: 16px; margin: 16px 0; cursor: pointer;
    }
    .code-label { font-size: 0.8rem; color: #94a3b8; margin-bottom: 4px; }
    .code-value { font-size: 2rem; font-weight: 800; letter-spacing: 6px; color: #60a5fa; }
    .copy-hint { font-size: 0.78rem; color: #64748b; margin-top: 6px; }
    .status {
      margin: 14px 0 8px; padding: 10px 14px; border-radius: 10px;
      background: #0f172a; font-size: 0.9rem; color: #cbd5e1;
    }
    .status.ok { color: #34d399; border: 1px solid #065f46; }
    .status.warn { color: #fbbf24; border: 1px solid #78350f; }
    .status.err { color: #f87171; border: 1px solid #7f1d1d; }
    .diag {
      font-size: 0.78rem; color: #94a3b8; margin-bottom: 12px; min-height: 18px;
    }
    .mic-wrap {
      background: #0f172a; border-radius: 99px; height: 8px; overflow: hidden;
      margin: 10px 0 16px; border: 1px solid #334155;
    }
    .mic-bar {
      height: 100%; width: 0%; background: #10b981; transition: width 0.08s linear;
    }
    .timer { font-size: 1.8rem; font-weight: 700; font-variant-numeric: tabular-nums; margin: 10px 0; color: #34d399; }
    .controls { display: flex; gap: 10px; margin-top: 12px; }
    .hidden { display: none !important; }
  </style>
</head>
<body>
  <div class="card">
    <h1>Phòng Gọi Thoại</h1>
    <p class="sub">v2.2 • Tắt thủ công</p>

    <!-- Màn hình chính -->
    <div id="homeView">
      <button id="createBtn" class="btn btn-primary">Tạo phòng (Host)</button>
      <div class="divider">hoặc vào phòng có sẵn</div>
      <div class="join-row">
        <input id="codeInput" type="text" maxlength="6" placeholder="NHẬP MÃ" autocomplete="off" />
        <button id="joinBtn" class="btn btn-success" style="width:auto; padding: 0 20px;">Vào</button>
      </div>
      <label class="opt-row" title="Bật khi gọi giữa 4G/5G hoặc Wi-Fi công ty bị chặn">
        <input id="forceRelayChk" type="checkbox" />
        <span>Ép qua TURN (bật nếu gọi 4G khó nối)</span>
      </label>
    </div>

    <!-- Màn hình trong phòng -->
    <div id="roomView" class="hidden">
      <div id="codeBox" class="code-box hidden" title="Bấm để sao chép">
        <div class="code-label">MÃ PHÒNG CỦA BẠN</div>
        <div id="codeDisplay" class="code-value">------</div>
        <div id="copyHint" class="copy-hint">Bấm vào mã để sao chép</div>
      </div>

      <div id="timer" class="timer hidden">00:00</div>
      <div id="status" class="status">Đang khởi tạo...</div>
      <div id="diag" class="diag"></div>

      <div style="font-size: 0.75rem; color: #64748b; text-align: left;">Âm lượng micro của bạn:</div>
      <div class="mic-wrap"><div id="micBar" class="mic-bar"></div></div>

      <div class="controls">
        <button id="muteBtn" class="btn btn-muted">Tắt mic</button>
        <button id="hangupBtn" class="btn btn-danger">Tắt máy</button>
      </div>
    </div>

    <audio id="remoteAudio" autoplay playsinline></audio>
  </div>

  <script>
    const APP_PREFIX = 'cf-voice-call-vn-9x2k-';

    const BASE_ICE_SERVERS = [
      { urls: 'stun:stun.l.google.com:19302' },
      { urls: 'stun:stun.relay.metered.ca:80' },
      {
        urls: 'turn:global.relay.metered.ca:80',
        username: '2f50aac419dcb5e14ea6161f',
        credential: 'pdjLgii+aijstW2B'
      },
      {
        urls: 'turn:global.relay.metered.ca:80?transport=tcp',
        username: '2f50aac419dcb5e14ea6161f',
        credential: 'pdjLgii+aijstW2B'
      },
      {
        urls: 'turn:global.relay.metered.ca:443',
        username: '2f50aac419dcb5e14ea6161f',
        credential: 'pdjLgii+aijstW2B'
      },
      {
        urls: 'turns:global.relay.metered.ca:443?transport=tcp',
        username: '2f50aac419dcb5e14ea6161f',
        credential: 'pdjLgii+aijstW2B'
      }
    ];

    function getPeerConfig() {
      const forceRelay = document.getElementById('forceRelayChk').checked;
      return {
        config: {
          iceServers: BASE_ICE_SERVERS,
          iceTransportPolicy: forceRelay ? 'relay' : 'all',
          iceCandidatePoolSize: 4
        }
      };
    }

    const homeView = document.getElementById('homeView');
    const roomView = document.getElementById('roomView');
    const createBtn = document.getElementById('createBtn');
    const joinBtn = document.getElementById('joinBtn');
    const codeInput = document.getElementById('codeInput');
    const codeBox = document.getElementById('codeBox');
    const codeDisplay = document.getElementById('codeDisplay');
    const copyHint = document.getElementById('copyHint');
    const statusEl = document.getElementById('status');
    const diagEl = document.getElementById('diag');
    const micBar = document.getElementById('micBar');
    const timerEl = document.getElementById('timer');
    const muteBtn = document.getElementById('muteBtn');
    const hangupBtn = document.getElementById('hangupBtn');
    const remoteAudio = document.getElementById('remoteAudio');

    let peer = null;
    let localStream = null;
    let currentCall = null;
    let dataConn = null;
    let isMuted = false;
    let timerInterval = null;
    let statsInterval = null;
    let micAnimFrame = null;
    let audioCtx = null;
    let seconds = 0;

    function unlockAudio() {
      try {
        const AudioCtx = window.AudioContext || window.webkitAudioContext;
        if (!audioCtx) audioCtx = new AudioCtx();
        if (audioCtx.state === 'suspended') audioCtx.resume();
        const buf = audioCtx.createBuffer(1, 1, 22050);
        const src = audioCtx.createBufferSource();
        src.buffer = buf;
        src.connect(audioCtx.destination);
        src.start(0);
        remoteAudio.muted = false;
        remoteAudio.play().catch(() => {});
      } catch {}
    }

    function startMicMeter(stream) {
      stopMicMeter();
      try {
        const AudioCtx = window.AudioContext || window.webkitAudioContext;
        if (!audioCtx) audioCtx = new AudioCtx();
        const source = audioCtx.createMediaStreamSource(stream);
        const analyser = audioCtx.createAnalyser();
        analyser.fftSize = 256;
        source.connect(analyser);
        const data = new Uint8Array(analyser.frequencyBinCount);

        function tick() {
          analyser.getByteFrequencyData(data);
          let sum = 0;
          for (let i = 0; i < data.length; i++) sum += data[i];
          const avg = sum / data.length;
          micBar.style.width = Math.min(100, Math.round(avg * 2.2)) + '%';
          micAnimFrame = requestAnimationFrame(tick);
        }
        tick();
      } catch {}
    }

    function stopMicMeter() {
      if (micAnimFrame) cancelAnimationFrame(micAnimFrame);
      micAnimFrame = null;
      micBar.style.width = '0%';
    }

    // Chỉ hiển thị thông số tham khảo, tuyệt đối không tự ngắt máy
    function startStatsMonitor(pc) {
      stopStatsMonitor();
      statsInterval = setInterval(async () => {
        if (!pc || !currentCall) return;
        try {
          const stats = await pc.getStats();
          let totalBytes = 0;
          let routeType = '';

          stats.forEach((report) => {
            if (report.type === 'inbound-rtp' && (report.kind === 'audio' || report.mediaType === 'audio')) {
              totalBytes += report.bytesReceived || 0;
            }
            if (report.type === 'candidate-pair' && report.state === 'succeeded') {
              const localCand = stats.get(report.localCandidateId);
              if (localCand) {
                routeType = localCand.candidateType === 'relay' ? 'Qua TURN' : 'Trực tiếp';
              }
            }
          });

          const badge = routeType ? ` • ${routeType}` : '';
          diagEl.textContent = `Đã nhận: ${Math.round(totalBytes / 1024)} KB${badge}`;
        } catch {}
      }, 1500);
    }

    function stopStatsMonitor() {
      if (statsInterval) clearInterval(statsInterval);
      statsInterval = null;
      diagEl.textContent = '';
    }

    function genCode() {
      const chars = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789';
      let out = '';
      for (let i = 0; i < 6; i++) out += chars[Math.floor(Math.random() * chars.length)];
      return out;
    }

    function setStatus(text, type = '') {
      statusEl.textContent = text;
      statusEl.className = 'status' + (type ? ' ' + type : '');
    }

    function startTimer() {
      stopTimer();
      seconds = 0;
      timerEl.textContent = '00:00';
      timerEl.classList.remove('hidden');
      timerInterval = setInterval(() => {
        seconds++;
        const m = String(Math.floor(seconds / 60)).padStart(2, '0');
        const s = String(seconds % 60).padStart(2, '0');
        timerEl.textContent = `${m}:${s}`;
      }, 1000);
    }

    function stopTimer() {
      if (timerInterval) clearInterval(timerInterval);
      timerInterval = null;
      timerEl.classList.add('hidden');
    }

    async function getMic() {
      try {
        const stream = await navigator.mediaDevices.getUserMedia({
          audio: { echoCancellation: true, noiseSuppression: true, autoGainControl: true },
          video: false
        });
        startMicMeter(stream);
        return stream;
      } catch (err) {
        alert('Không truy cập được micro. Hãy cấp quyền Micro cho trình duyệt rồi thử lại.');
        throw err;
      }
    }

    function showRoom(showCode) {
      homeView.classList.add('hidden');
      roomView.classList.remove('hidden');
      codeBox.classList.toggle('hidden', !showCode);
    }

    function attachStreamToAudio(stream) {
      if (!stream) return;
      remoteAudio.srcObject = stream;
      remoteAudio.muted = false;
      remoteAudio.volume = 1.0;
      remoteAudio.play().catch((e) => {
        diagEl.textContent = 'Trình duyệt chặn tự phát loa: ' + e.name;
      });
    }

    function setupCall(call) {
      currentCall = call;

      call.on('stream', (remoteStream) => {
        attachStreamToAudio(remoteStream);
        setStatus('Đã kết nối!', 'ok');
        startTimer();
        if (call.peerConnection) startStatsMonitor(call.peerConnection);
      });

      call.on('close', () => cleanup('Cuộc gọi đã kết thúc.'));
      call.on('error', () => cleanup('Mất kết nối cuộc gọi.', true));

      if (call.peerConnection) {
        const pc = call.peerConnection;
        pc.addEventListener('track', (e) => {
          if (e.streams && e.streams[0]) attachStreamToAudio(e.streams[0]);
        });
        pc.oniceconnectionstatechange = () => {
          const state = pc.iceConnectionState;
          if (state === 'disconnected' || state === 'failed') {
            setStatus('Mạng đang yếu hoặc chưa thông, đang giữ phòng...', 'warn');
          } else if (state === 'connected' || state === 'completed') {
            setStatus('Đã kết nối!', 'ok');
          }
        };
      }
    }

    function setupDataConn(conn) {
      dataConn = conn;
      conn.on('data', (msg) => {
        if (msg === 'hangup') cleanup('Đối phương đã tắt máy.');
      });
      conn.on('close', () => {
        if (currentCall) cleanup('Đối phương đã rời phòng.');
      });
    }

    function cleanup(message = '', isErr = false) {
      stopTimer();
      stopStatsMonitor();
      stopMicMeter();
      if (dataConn && dataConn.open) {
        try { dataConn.send('hangup'); } catch {}
        dataConn.close();
      }
      if (currentCall) currentCall.close();
      if (peer) peer.destroy();
      if (localStream) localStream.getTracks().forEach(t => t.stop());

      peer = null; localStream = null; currentCall = null; dataConn = null;
      remoteAudio.srcObject = null;
      isMuted = false;
      muteBtn.textContent = 'Tắt mic';
      muteBtn.classList.remove('active');

      if (message) {
        setStatus(message, isErr ? 'err' : '');
        setTimeout(() => {
          roomView.classList.add('hidden');
          homeView.classList.remove('hidden');
        }, 1800);
      } else {
        roomView.classList.add('hidden');
        homeView.classList.remove('hidden');
      }
    }

    // 1. HOST: Tạo phòng
    createBtn.addEventListener('click', async () => {
      unlockAudio();
      try { localStream = await getMic(); } catch { return; }

      const roomCode = genCode();
      showRoom(true);
      codeDisplay.textContent = roomCode;
      setStatus('Đang tạo phòng...');

      peer = new Peer(APP_PREFIX + roomCode, getPeerConfig());
      peer.on('open', () => setStatus('Phòng đã sẵn sàng. Đang chờ người kia nhập mã...'));
      peer.on('connection', (conn) => setupDataConn(conn));
      peer.on('call', (call) => {
        if (currentCall) { call.close(); return; }
        setStatus('Có người đang vào phòng...');
        call.answer(localStream);
        setupCall(call);
      });
      peer.on('disconnected', () => {
        if (peer && !peer.destroyed) peer.reconnect();
      });
      peer.on('error', (err) => cleanup('Lỗi kết nối máy chủ: ' + err.type, true));
    });

    // 2. GUEST: Nhập mã để vào phòng
    joinBtn.addEventListener('click', async () => {
      unlockAudio();
      const code = codeInput.value.trim().toUpperCase();
      if (code.length < 4) { alert('Vui lòng nhập đúng mã phòng.'); return; }

      try { localStream = await getMic(); } catch { return; }

      showRoom(false);
      setStatus('Đang kết nối tới phòng ' + code + '...');

      peer = new Peer(undefined, getPeerConfig());
      peer.on('open', () => {
        const hostId = APP_PREFIX + code;
        setupDataConn(peer.connect(hostId));
        setupCall(peer.call(hostId, localStream));
      });
      peer.on('disconnected', () => {
        if (peer && !peer.destroyed) peer.reconnect();
      });
      peer.on('error', (err) => {
        if (err.type === 'peer-unavailable') {
          cleanup('Không tìm thấy mã phòng này hoặc Host chưa mở.', true);
        } else {
          cleanup('Lỗi kết nối: ' + err.type, true);
        }
      });
    });

    codeInput.addEventListener('keydown', (e) => {
      if (e.key === 'Enter') joinBtn.click();
    });

    codeBox.addEventListener('click', async () => {
      try {
        await navigator.clipboard.writeText(codeDisplay.textContent);
        copyHint.textContent = 'Đã sao chép mã!';
        setTimeout(() => copyHint.textContent = 'Bấm vào mã để sao chép', 1500);
      } catch {}
    });

    muteBtn.addEventListener('click', () => {
      if (!localStream) return;
      isMuted = !isMuted;
      localStream.getAudioTracks().forEach(t => t.enabled = !isMuted);
      muteBtn.textContent = isMuted ? 'Bật mic' : 'Tắt mic';
      muteBtn.classList.toggle('active', isMuted);
    });

    hangupBtn.addEventListener('click', () => cleanup('Bạn đã kết thúc cuộc gọi.'));
  </script>
</body>
</html>
